<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Permanent Container Tabs — Settings</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 1rem; }
    h1 { color: #333; font-size: 1.4rem; }
    .setting { margin: 1rem 0; display: flex; align-items: flex-start; gap: 0.75rem; }
    .setting input[type=checkbox] { margin-top: 0.2rem; width: 1rem; height: 1rem; }
    .setting label { color: #333; }
    .setting .description { color: #666; font-size: 0.875rem; margin-top: 0.2rem; }
    .warning { color: #c0392b; font-size: 0.85rem; margin-top: 0.2rem; }
    .toggle-group { margin: 1rem 0; }
    .toggle-group .label { color: #333; font-weight: 500; margin-bottom: 0.5rem; }
    .toggle-group .description { color: #666; font-size: 0.875rem; margin-bottom: 0.5rem; }
    .toggle-option { display: flex; align-items: center; gap: 0.6rem; margin: 0.35rem 0; }
    .toggle-option input[type=radio] { width: 1rem; height: 1rem; }
    .toggle-option label { color: #333; }
  </style>
</head>
<body>
  <h1>Permanent Container Tabs Settings</h1>
  <form id="settings-form">
    <div class="toggle-group">
      <div class="label">Default container action</div>
      <div class="description">Which operation runs when you pick a container from the context menu.</div>
      <div class="toggle-option">
        <input type="radio" id="prioritizeOpen" name="prioritizeReopen" value="open" />
        <label for="prioritizeOpen">Prioritize Opening in a new tab over Reopening</label>
      </div>
      <div class="toggle-option">
        <input type="radio" id="prioritizeReopen" name="prioritizeReopen" value="reopen" />
        <label for="prioritizeReopen">Prioritize Reopening over Opening in a new tab</label>
      </div>
    </div>

    <div class="setting">
      <input type="checkbox" id="suppressIsolationInfo" />
      <div>
        <label for="suppressIsolationInfo">Never show TC isolation info page</label>
        <div class="description">Suppress the informational page that opens when Temporary Containers redirects a tab.</div>
      </div>
    </div>
  </form>
  <script src="options.js"></script>
</body>
</html>
